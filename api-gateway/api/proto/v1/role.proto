syntax = "proto3";

package accounts.v1;

import "common.proto";
import "permission.proto";
import "google/protobuf/timestamp.proto";

option go_package = "accounts/api/proto/v1;accountsv1";

service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (RoleResponse);
  rpc GetRole(GetRoleRequest) returns (RoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (RoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc AssignPermissionsToRole(AssignPermissionsToRoleRequest) returns (RoleResponse);
}

message RoleResponse {
  string id = 1;
  string name = 2;
  repeated PermissionResponse permissions = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateRoleRequest {
  string name = 1;
  repeated string permission_ids = 2;
}

message GetRoleRequest {
  string id = 1;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  repeated string permission_ids = 3;
}

message DeleteRoleRequest {
  string id = 1;
}

message DeleteRoleResponse {
  bool success = 1;
  string message = 2;
}

message ListRolesRequest {
  PaginationRequest pagination = 1;
}

message ListRolesResponse {
  repeated RoleResponse roles = 1;
  PaginationMetadata pagination = 2;
}

message AssignPermissionsToRoleRequest {
  string role_id = 1;
  repeated string permission_ids = 2;
}
