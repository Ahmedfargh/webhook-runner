services:
  # ============================================================================
  # 1. MySQL Database Service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: webhook_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_connections=1000
    env_file:
      - .env
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - webhook_network

  # ============================================================================
  # 2. Accounts gRPC Microservice (Port 50051)
  # ============================================================================
  accounts:
    build:
      context: ./accounts
      dockerfile: Dockerfile
    container_name: webhook_accounts
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_NAME: ${ACCOUNTS_DB_NAME:-webhook_accounts}
      GRPC_PORT: ${ACCOUNTS_GRPC_PORT:-50051}
    ports:
      - "${ACCOUNTS_GRPC_PORT:-50051}:50051"
    networks:
      - webhook_network

  # ============================================================================
  # 3. Subscriptions gRPC Microservice (Port 50052)
  # ============================================================================
  subscriptions:
    build:
      context: ./subscriptions
      dockerfile: Dockerfile
    container_name: webhook_subscriptions
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_NAME: ${SUBSCRIPTIONS_DB_NAME:-webhook_subscriptions}
      GRPC_PORT: ${SUBSCRIPTIONS_GRPC_PORT:-50052}
    ports:
      - "${SUBSCRIPTIONS_GRPC_PORT:-50052}:50052"
    networks:
      - webhook_network

  # ============================================================================
  # 4. API Gateway REST Microservice (Port 8080)
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: webhook_api_gateway
    restart: unless-stopped
    depends_on:
      - accounts
      - subscriptions
    env_file:
      - .env
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - webhook_network

  # ============================================================================
  # 5. Vue 3 + Nginx Frontend (Port 5173)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: webhook_frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    env_file:
      - .env
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - webhook_network

# ==============================================================================
# Storage Volumes & Networks
# ==============================================================================
volumes:
  mysql_data:
    driver: local

networks:
  webhook_network:
    driver: bridge
