services:
  # ============================================================================
  # 1A. MySQL Database Service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: webhook_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_connections=1000
    env_file:
      - .env
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - webhook_network

  # ============================================================================
  # 1B. Apache Kafka Event Streaming Broker (KRaft Mode - Port 9092)
  # ============================================================================
  kafka:
    image: apache/kafka:latest
    container_name: webhook_kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - webhook_network

  # ============================================================================
  # 2. Accounts gRPC Microservice (Port 50051)
  # ============================================================================
  accounts:
    build:
      context: ./accounts
      dockerfile: Dockerfile
    container_name: webhook_accounts
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_NAME: ${ACCOUNTS_DB_NAME:-webhook_accounts}
      GRPC_PORT: ${ACCOUNTS_GRPC_PORT:-50051}
    ports:
      - "${ACCOUNTS_GRPC_PORT:-50051}:50051"
    networks:
      - webhook_network

  # ============================================================================
  # 3. Subscriptions gRPC Microservice (Port 50052)
  # ============================================================================
  subscriptions:
    build:
      context: ./subscriptions
      dockerfile: Dockerfile
    container_name: webhook_subscriptions
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_NAME: ${SUBSCRIPTIONS_DB_NAME:-webhook_subscriptions}
      GRPC_PORT: ${SUBSCRIPTIONS_GRPC_PORT:-50052}
    ports:
      - "${SUBSCRIPTIONS_GRPC_PORT:-50052}:50052"
    networks:
      - webhook_network

  # ============================================================================
  # 4. Webhook Runner gRPC Microservice & Kafka Worker (Port 50053)
  # ============================================================================
  webhook-runner:
    build:
      context: ./webhook-runner
      dockerfile: Dockerfile
    container_name: webhook_runner
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_NAME: ${RUNNER_DB_NAME:-webhook_runner}
      GRPC_PORT: ${RUNNER_GRPC_PORT:-50053}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_TOPIC_WEBHOOK_DISPATCH: ${KAFKA_TOPIC_WEBHOOK_DISPATCH:-webhook-dispatches}
      KAFKA_TOPIC_WEBHOOK_RESULTS: ${KAFKA_TOPIC_WEBHOOK_RESULTS:-webhook-results}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-webhook-runner-group}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    ports:
      - "${RUNNER_GRPC_PORT:-50053}:50053"
    networks:
      - webhook_network

  # ============================================================================
  # 5. Audit gRPC Microservice & Kafka Worker (Port 50054)
  # ============================================================================
  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    container_name: webhook_audit
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_NAME: ${AUDIT_DB_NAME:-webhook_audit}
      GRPC_PORT: ${AUDIT_GRPC_PORT:-50054}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_TOPIC_AUDIT_EVENTS: ${KAFKA_TOPIC_AUDIT_EVENTS:-audit-events}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-audit-service-group}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    ports:
      - "${AUDIT_GRPC_PORT:-50054}:50054"
    networks:
      - webhook_network

  # ============================================================================
  # 5B. Request Tracker Microservice & Kafka Worker (Port 50055)
  # ============================================================================
  request-tracker-service:
    build:
      context: ./request-tracker-service
      dockerfile: Dockerfile
    container_name: webhook_request_tracker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_NAME: ${REQUEST_TRACKER_DB_NAME:-webhook_request_tracker}
      GRPC_PORT: ${REQUEST_TRACKER_GRPC_PORT:-50055}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_TOPIC_REQUEST_TRACES: ${KAFKA_TOPIC_REQUEST_TRACES:-http-request-traces}
      KAFKA_REQUEST_TRACKER_GROUP_ID: ${KAFKA_REQUEST_TRACKER_GROUP_ID:-request-tracker-group}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    ports:
      - "${REQUEST_TRACKER_GRPC_PORT:-50055}:50055"
    networks:
      - webhook_network

  # ============================================================================
  # 6. API Gateway REST Microservice (Port 8080)
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: webhook_api_gateway
    restart: unless-stopped
    depends_on:
      - accounts
      - subscriptions
      - webhook-runner
      - audit-service
      - request-tracker-service
      - kafka
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_TOPIC_WEBHOOK_DISPATCH: ${KAFKA_TOPIC_WEBHOOK_DISPATCH:-webhook-dispatches}
      KAFKA_TOPIC_WEBHOOK_RESULTS: ${KAFKA_TOPIC_WEBHOOK_RESULTS:-webhook-results}
      KAFKA_TOPIC_REQUEST_TRACES: ${KAFKA_TOPIC_REQUEST_TRACES:-http-request-traces}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - webhook_network

  # ============================================================================
  # 6. Vue 3 + Nginx Frontend (Port 5173)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: webhook_frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    env_file:
      - .env
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - webhook_network

# ==============================================================================
# Storage Volumes & Networks
# ==============================================================================
volumes:
  mysql_data:
    driver: local
  kafka_data:
    driver: local

networks:
  webhook_network:
    driver: bridge
